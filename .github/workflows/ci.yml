name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        # TODO: remove continue-on-error once the formatting burn-down across
        # the ~330 currently-unformatted files lands (tracked separately).
        continue-on-error: true
        run: bun run format:check

      - name: Test
        # scripts/cityGolden.ts's contract is narrowed to structural properties
        # confirmed identical across V8 and JavaScriptCore (2026-09-05, see
        # wiki/notes/decision-cross-runtime-determinism.md), so it runs in CI
        # like every other gate script. CITY_GOLDEN=skip still exists as a
        # manual local escape hatch (scripts/test.ts) if new drift ever surfaces.
        run: bun run test
