name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        # TODO: remove continue-on-error once the formatting burn-down across
        # the ~330 currently-unformatted files lands (tracked separately).
        continue-on-error: true
        run: bun run format:check

      - name: Test
        # CITY_GOLDEN=skip: scripts/cityGolden.ts is a cross-runtime/cross-OS
        # determinism trap (Math.sin/cos/atan2/hypot aren't ECMA-262-exact —
        # see wiki/notes/decision-cross-runtime-determinism.md), not a real
        # regression on this branch. Skipped in CI only; runs locally by default.
        env:
          CITY_GOLDEN: skip
        run: bun run test
